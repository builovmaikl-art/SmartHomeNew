name: SmartHome Automation

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      task:
        description: "Что запускать"
        required: true
        default: "compile"
        type: choice
        options:
          - compile
          - diagnostics
          - snapshot
      note:
        description: "Комментарий к запуску"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run-task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve snapshot date folder
        if: ${{ inputs.task == 'snapshot' }}
        run: |
          echo "SNAPSHOT_DATE=$(date +%F)" >> "$GITHUB_ENV"

      - name: Snapshot runtime files from project root
        if: ${{ inputs.task == 'snapshot' }}
        run: |
          mkdir -p "snapshots/${SNAPSHOT_DATE}"
          find . -maxdepth 1 -type f \( -iname "*.st" -o -iname "*.gvl" -o -iname "*.dut" \) -exec cp {} "snapshots/${SNAPSHOT_DATE}/" \;

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare folders
        run: |
          mkdir -p "компилятор/logs"
          mkdir -p "компилятор/out"

      - name: Show trigger info
        run: |
          echo "event=${{ github.event_name }}" | tee "компилятор/logs/workflow_meta.log"
          echo "ref=${{ github.ref }}" | tee -a "компилятор/logs/workflow_meta.log"
          echo "sha=${{ github.sha }}" | tee -a "компилятор/logs/workflow_meta.log"
          echo "task=${{ inputs.task || 'compile' }}" | tee -a "компилятор/logs/workflow_meta.log"
          echo "note=${{ inputs.note || '' }}" | tee -a "компилятор/logs/workflow_meta.log"
          echo "snapshot_date=${SNAPSHOT_DATE:-}" | tee -a "компилятор/logs/workflow_meta.log"

      - name: Install dependencies if needed
        run: |
          python -V > "компилятор/logs/python_version.log" 2>&1
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt > "компилятор/logs/pip_install.log" 2>&1 || true
          fi

      - name: Run diagnostics
        if: ${{ github.event_name == 'push' || inputs.task == 'diagnostics' }}
        run: |
          {
            echo "=== git status ==="
            git status
            echo
            echo "=== repo tree root ==="
            ls -la
            echo
            echo "=== compiler dir ==="
            ls -la "компилятор" || true
            echo
            echo "=== compiler out dir before compile ==="
            ls -la "компилятор/out" || true
          } > "компилятор/logs/diagnostics.log" 2>&1

      - name: Run compile script
        if: ${{ github.event_name == 'push' || inputs.task == 'compile' }}
        run: |
          rm -f "компилятор/out"/*.xml || true
          if [ -f "компилятор/import_codesys_FINAL.py" ]; then
            python "компилятор/import_codesys_FINAL.py" > "компилятор/logs/final_test.log" 2>&1
          else
            echo "File not found: компилятор/import_codesys_FINAL.py" > "компилятор/logs/final_test.log"
            exit 1
          fi
          if [ ! -f "компилятор/out/RESULT_methods_clean.xml" ]; then
            echo "ERROR: expected final file not found: компилятор/out/RESULT_methods_clean.xml" >> "компилятор/logs/final_test.log"
            echo "=== compiler out dir after compile ===" >> "компилятор/logs/final_test.log"
            ls -la "компилятор/out" >> "компилятор/logs/final_test.log" 2>&1 || true
            exit 1
          fi
          find "компилятор/out" -maxdepth 1 -type f -name '*.xml' ! -name 'RESULT_methods_clean.xml' -delete

      - name: Upload logs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarthome-logs
          path: |
            компилятор/logs/
            компилятор/out/RESULT_methods_clean.xml

      - name: Commit logs and outputs back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "компилятор/logs" || true
          git add -u "компилятор/out" || true
          if [ -f "компилятор/out/RESULT_methods_clean.xml" ]; then
            git add "компилятор/out/RESULT_methods_clean.xml"
          fi
          if [ -n "${SNAPSHOT_DATE}" ] && [ -d "snapshots/${SNAPSHOT_DATE}" ]; then
            git add "snapshots/${SNAPSHOT_DATE}" || true
          fi
          git diff --cached --quiet || git commit -m "ci: update logs, final methods-clean output, and dated runtime snapshot"
          git push
