name: SmartHome Compile

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare log directory
        run: mkdir -p ./компилятор/logs

      - name: Make shell scripts executable
        run: find ./компилятор -type f -name "*.sh" -exec chmod +x {} \;

      - name: Find compile script
        id: find_script
        run: |
          SCRIPT=$(find ./компилятор -type f -name "run_compile*.sh" | head -n 1)
          echo "FOUND_SCRIPT=$SCRIPT"
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: compile script not found under ./компилятор"
            exit 1
          fi
          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"

      - name: Run compile script
        run: |
          bash "${{ steps.find_script.outputs.script }}" > ./компилятор/logs/ci_run.log 2>&1

      - name: Show last log lines
        if: always()
        run: |
          echo "===== LAST 200 LINES OF ci_run.log ====="
          tail -n 200 ./компилятор/logs/ci_run.log || true

      - name: Upload compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-logs
          path: |
            ./компилятор/logs/
            ./compile_manual.log
            ./compile_trace.log
