name: repo-guard

on:
  push:
    branches:
      - main
      - master
      - '**'
  pull_request:

jobs:
  repo-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show environment
        run: |
          pwd
          python3 --version
          ls -la
          echo "---- compiler dir ----"
          ls -la "компилятор" || true

      - name: Run repo guard
        run: |
          python3 tools/repo_guard/repo_guard.py
